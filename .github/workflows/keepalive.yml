# Evita que Supabase (plan gratis) pause el proyecto por inactividad.
# Debe guardarse en tu repositorio con esta ruta exacta:  .github/workflows/keepalive.yml
# Y necesita 2 "Secrets" en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL        = https://fkeluulmisjlnkwotyop.supabase.co   
#   SUPABASE_ANON_KEY   = sb_publishable_p0hVuOTBwTCBIoKp-cww2Q_vbH8L85z
name: Mantener Supabase activo
on:
  schedule:
    - cron: "0 14 */3 * *"   # cada 3 días
  workflow_dispatch: {}       # también se puede ejecutar a mano
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la base de datos
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/docs?select=path&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Respuesta de Supabase: $code"
